name: Android — APK

# Construit un APK installable sans compte Expo : génération native (prebuild) puis Gradle.
# L'APK est signé avec la clé de debug générée par Expo : parfait pour la famille, les tests et les démos.
# Pour le Play Store, utiliser EAS Build (voir README) ou ajouter une clé de signature en secret.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Génération du projet Android
        run: npx expo prebuild -p android --no-install
      - name: Compilation de l'APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Renommage
        run: cp android/app/build/outputs/apk/release/app-release.apk my-language-baddy.apk
      - uses: actions/upload-artifact@v4
        with:
          name: my-language-baddy-apk
          path: my-language-baddy.apk
      - name: Publication de l'APK dans une Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('android-{0}', github.run_number) }}
          name: My Language Baddy — Android ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build {0}', github.run_number) }}
          make_latest: true
          body: |
            APK Android de My Language Baddy (commit ${{ github.sha }}).
            Installation : ouvrir ce lien sur le téléphone, télécharger `my-language-baddy.apk`, puis autoriser l'installation depuis cette source.
          files: my-language-baddy.apk
